[project]
name = "production-ai-research-agent"
version = "0.1.0"
description = "Production-grade AI research and engineering knowledge agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Sanjeev Sankar J" }
]
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.141,<1.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "pypdf>=5,<7",
    "sentence-transformers>=5,<6",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.52,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx2>=0.1",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"