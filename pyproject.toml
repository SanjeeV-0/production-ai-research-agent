[project]
name = "production-ai-research-agent"
version = "0.1.0"
description = "Production-grade AI research and engineering knowledge agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Sanjeev Sankar J" }
]
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx2>=0.1",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"